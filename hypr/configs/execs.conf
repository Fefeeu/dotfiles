# Wallpapers
exec-once = swww-daemon

# Agente do polkit (janela de senha para hostnamectl e apps de admin)
exec-once = /usr/libexec/kf6/polkit-kde-authentication-agent-1

# Waybar
exec-once = ~/.config/waybar/scripts/launch.sh

# Wi-Fi
exec-once = nm-applet

# Notificação de Bateria Baixa
exec-once = ~/.config/hypr/scripts/battery-notify.sh

# Historico de area de tranferencia
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

