$terminal = kitty
$fileManager = dolphin
$menu = ~/.config/rofi/launchers/type-3/launcher.sh

general {
    # bordas, gaps e cores vêm do tema (~/.config/theme/hypr.conf)
    resize_on_border = false
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

input {
    kb_layout = br, us
    follow_mouse = 1
    # sensibilidade e aceleração do mouse ficam em hypr/maquinas/<Nome>/hardware.conf
    touchpad {
        natural_scroll = true
        scroll_factor = 0.25 

    }
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}

gesture = 3, horizontal, workspace
