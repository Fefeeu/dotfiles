env = QT_QPA_PLATFORMTHEME, qt6ct

# Máquina: GPU, teclados e monitores (link criado pelo switch-theme.sh)
source = ~/.config/hypr/maquina/hardware.conf
source = ~/.config/hypr/maquina/monitors.conf

# Configurações Modulares
source = ~/.config/hypr/configs/settings.conf
source = ~/.config/hypr/configs/animations.conf
source = ~/.config/hypr/configs/execs.conf
source = ~/.config/theme/hypr.conf

# Regras e Binds
source = ~/.config/hypr/rules/windowrules.conf
source = ~/.config/hypr/rules/binds.conf

