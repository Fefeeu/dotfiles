# Variáveis para NVIDIA
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

# Correções visuais para NVIDIA
cursor {
    no_hardware_cursors = true
}

# Tearing: deixa os jogos (regra immediate no windowrules.conf) mostrarem o
# quadro na hora, sem esperar a tela
general:allow_tearing = true

# Mouse: sensibilidade e aceleração (flat = sem aceleração)
input {
    sensitivity = -0.25
    accel_profile = flat
}
