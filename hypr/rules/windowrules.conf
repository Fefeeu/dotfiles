# Regras de janela (Hyprland 0.56: o filtro vem em match:<campo> e cada
# efeito leva um valor, como on, um número ou um modo)

# --- GERAL ---
# Nenhum app se maximiza sozinho
windowrule = match:class .*, suppress_event maximize
# Em tela cheia, cantos retos
windowrule = match:fullscreen true, rounding 0

# --- JOGOS (Steam) ---
# Menos atraso na imagem (tearing, se o hardware permitir)
windowrule = match:class ^(steam_app_.*)$, immediate on
# A tela não apaga nem bloqueia durante o jogo
windowrule = match:class ^(steam_app_.*)$, idle_inhibit always
# Deixa o jogo escolher qualquer tamanho de janela
windowrule = match:class ^(steam_app_.*)$, min_size 1 1
# Sem efeitos: blur, transparência, borda e cantos arredondados
windowrule = match:class ^(steam_app_.*)$, no_blur on
windowrule = match:class ^(steam_app_.*)$, opaque on
windowrule = match:class ^(steam_app_.*)$, border_size 0
windowrule = match:class ^(steam_app_.*)$, rounding 0

# --- XWAYLAND ---
# Janelas-fantasma de apps X11 (sem classe nem título) não roubam o foco
windowrule = match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false, no_focus on
# Vivaldi: fixa o estado de tela cheia (interno 3 = maximizado + tela cheia;
# o que o app recebe: 2 = tela cheia)
windowrule = match:class ^(vivaldi-stable)$, fullscreen_state 3 2

# --- POP-UP DO WI-FI (nmtui aberto pelo waybar) ---
windowrule = match:class ^(kitty-nmtui)$, float on
windowrule = match:class ^(kitty-nmtui)$, size 600 400
windowrule = match:class ^(kitty-nmtui)$, center on
