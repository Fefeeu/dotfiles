# Regras de janela (Hyprland 0.51: windowrule já usa a sintaxe com campos,
# como class: e title:; windowrulev2 é só um nome antigo)

# --- GERAL ---
# Nenhum app se maximiza sozinho
windowrule = suppressevent maximize, class:.*
# Em tela cheia, cantos retos
windowrule = rounding 0, fullscreen:1

# --- JOGOS (Steam) ---
# Menos atraso na imagem (tearing, se o hardware permitir)
windowrule = immediate, class:^(steam_app_.*)$
# A tela não apaga nem bloqueia durante o jogo
windowrule = idleinhibit always, class:^(steam_app_.*)$
# Deixa o jogo escolher qualquer tamanho de janela
windowrule = minsize 1 1, class:^(steam_app_.*)$
# Sem efeitos: blur, transparência, borda e cantos arredondados
windowrule = noblur, class:^(steam_app_.*)$
windowrule = opaque, class:^(steam_app_.*)$
windowrule = noborder, class:^(steam_app_.*)$
windowrule = rounding 0, class:^(steam_app_.*)$

# --- XWAYLAND ---
# Janelas-fantasma de apps X11 (sem classe nem título) não roubam o foco
windowrule = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0
# Vivaldi: fixa o estado de tela cheia (interno 3 = maximizado + tela cheia;
# o que o app recebe: 2 = tela cheia)
windowrule = fullscreenstate 3 2, class:^(vivaldi-stable)$

# --- POP-UP DO WI-FI (nmtui aberto pelo waybar) ---
windowrule = float, class:^(kitty-nmtui)$
windowrule = size 600 400, class:^(kitty-nmtui)$
windowrule = center, class:^(kitty-nmtui)$
