# Variáveis para AMD
env = LIBVA_DRIVER_NAME,radeonsi
env = GBM_BACKEND,drm

# Tearing: deixa os jogos (regra immediate no windowrules.conf) mostrarem o
# quadro na hora, sem esperar a tela
general:allow_tearing = true

# Teclado externo: layout us primeiro
device {
    name = compx-kysona-m600
    kb_layout = us,br
}

# Mouse: sensibilidade e aceleração (flat = sem aceleração)
input {
    sensitivity = -0.25
    accel_profile = flat
}
